<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contacto con Lic. Analía Lima, Psicóloga." />
    <title>Contacto · Lic. Analía Lima</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="contact-page">
    <header class="topbar contact-top"><a class="brand rise" style="--delay:0ms" href="index.html">LIC. ANALÍA <span>LIMA</span></a><a class="soft-cta rise" style="--delay:120ms" href="index.html">Volver al inicio <span>←</span></a></header>
    <main class="contact-main">
      <section class="contact-intro"><p class="eyebrow rise" style="--delay:240ms">Primer contacto</p><h1 class="rise" style="--delay:340ms">Empecemos<br />con calma.</h1><p class="rise" style="--delay:440ms">Completá el formulario y se abrirá un correo dirigido a Analía con tu consulta. Te responderá a la brevedad.</p><a class="whatsapp-link rise" style="--delay:520ms" href="https://wa.me/5493586009675?text=Hola%20Anal%C3%ADa%2C%20quisiera%20realizar%20una%20consulta." target="_blank" rel="noopener">¿Preferís WhatsApp? Escribime <span>↗</span></a></section>
      <section class="form-wrap rise" style="--delay:420ms"><form id="contact-form"><div class="field"><label for="name">Nombre y apellido</label><input id="name" name="name" required autocomplete="name" /></div><div class="field"><label for="email">Tu email</label><input id="email" name="email" type="email" required autocomplete="email" /></div><div class="field"><label for="phone">Teléfono <small>(opcional)</small></label><input id="phone" name="phone" type="tel" autocomplete="tel" /></div><div class="field"><label for="reason">¿En qué puedo acompañarte?</label><textarea id="reason" name="reason" rows="5" required></textarea></div><label class="check"><input type="checkbox" required /><span>Acepto que mis datos sean utilizados únicamente para responder esta consulta.</span></label><button class="button" type="submit">Enviar consulta <span>→</span></button><p class="form-note">Al enviar se abrirá tu aplicación de correo con la información cargada.</p></form></section>
    </main><script type="module" src="/script.js"></script>
  </body>
</html>
